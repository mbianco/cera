# Docs — Build and deploy to GitHub Pages
#
# Builds the MkDocs site and deploys to github.io. Runs on every
# push to main that changes files in docs/ or mkdocs.yml.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install mkdocs

      - name: Build site
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/mbianco/cera.git
          mkdocs gh-deploy --force --no-history
