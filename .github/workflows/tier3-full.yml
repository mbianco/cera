# cera — Tier 3: Full e2e (nightly + pre-release)
#
# Runs the full test suite with coverage. All tests are mocked —
# NO real HPC services (SLURM, uenv, FirecREST, CDO, CESM) are
# accessed in CI.
#
# Real HPC testing is done manually by developers using their own
# credentials. See src/smoke-test.ts. Do NOT add HPC credentials
# (CERA_CLIENT_ID, CERA_CLIENT_SECRET) to GitHub Secrets or enable
# the hpc-e2e job below without explicit approval.
#
# Spec: ~/.config/opencode/guidelines/ci.md (Tier 3)
# Spec: specs/architecture/build-phases.md (Tier 3 column)

name: Tier 3 — Full

on:
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Manual trigger for pre-release validation

permissions:
  contents: read

jobs:
  full-e2e:
    name: Full End-to-End
    # When a self-hosted Alps runner is available:
    # runs-on: [self-hosted, alps, login]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src tests --max-warnings=0

      - name: Full test suite (all tiers, all mocked)
        run: npx vitest run --coverage --exclude "src/smoke-test.ts"

      - name: Upload coverage
        if: always() && hashFiles('coverage/') != ''
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-full
          path: coverage/
          retention-days: 90

  # ──────────────────────────────────────────────────────────────
  # HPC e2e tests — DO NOT ENABLE IN CI
  #
  # Real HPC testing (SLURM, uenv, FirecREST, CDO, CESM) is done
  # manually by developers using their own credentials. The smoke
  # test (src/smoke-test.ts) is the entry point. Do NOT add HPC
  # credentials to GitHub Secrets or uncomment this job without
  # explicit approval from the project lead.
  # ──────────────────────────────────────────────────────────────
  #
  # hpc-e2e:
  #   name: HPC End-to-End (Alps) — DISABLED, manual only
  #   runs-on: [self-hosted, alps, login]
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v7
  #
  #     - name: Install dependencies
  #       run: npm ci || npm install
  #
  #     - name: Smoke test (requires developer credentials)
  #       run: node dist/smoke-test.mjs
  #       env:
  #         CERA_CLIENT_ID: ${{ secrets.CERA_CLIENT_ID }}
  #         CERA_CLIENT_SECRET: ${{ secrets.CERA_CLIENT_SECRET }}
  #         CERA_TOKEN_ENDPOINT: ${{ secrets.CERA_TOKEN_ENDPOINT }}
  #         CERA_FIRECREST_URL: ${{ secrets.CERA_FIRECREST_URL }}
  #         CERA_SYSTEM: ${{ secrets.CERA_SYSTEM }}
